name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The repository is squash-only with squash_merge_commit_title set to
      # PR_TITLE, so the PR title is the only subject that reaches main -
      # it, not the branch commits, is what release-please reads.
      # commitlint.ci.config.mjs turns off the default ignore for
      # "Merge ..."-shaped subjects: that ignore exists for commits git
      # writes itself, but nothing writes a PR title except a person, so it
      # would otherwise let a hand-typed "Merge ..." title bypass the
      # convention entirely.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --config commitlint.ci.config.mjs

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only: the remaining findings (sharp, uuid, extract-zip, tmp)
    # sit deep in playwright/lighthouse/next's own transitive trees with
    # either no fix yet or only a major bump available, so a regression
    # here is a signal to look at, not a reason to block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Scan lockfile with osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run E2E tests
        run: pnpm e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  lighthouse:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Report-only: no budget has been tuned against real traffic yet, so a
    # regression here is a signal to look at, not a reason to block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
